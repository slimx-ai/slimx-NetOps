[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slimx-netops"
version = "0.4.1"
description = "SlimX-NetOps: a bounded, READ-ONLY network telemetry bridge for the SlimX platform. Exposes ssh_show/snmp_get/prometheus_query/alertmanager_alerts/logs_query as MCP-over-HTTP tools behind a command/OID allowlist."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SlimX AI" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The real device libraries — heavy (crypto, SNMP). Lazy-imported only by the live
# clients, so core install + CI + fixture mode never pull them in. Install with
# `pip install slimx-netops[live]` on the box that actually reaches the devices.
live = [
    "netmiko>=4.3",
    "pysnmp>=6.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["slimx_netops*"]

[tool.setuptools.package-data]
slimx_netops = ["fixtures/*", "fixtures/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
